<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#36437f">
    <title>Offline | ATPL Sales Portal</title>
    <style>
      body { align-items: center; background: #f5f7fb; color: #23304f; display: flex; font: 16px system-ui, sans-serif; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; }
      main { background: white; border: 1px solid #dce2ed; border-radius: 16px; max-width: 440px; padding: 28px; }
      button { background: #36437f; border: 0; border-radius: 8px; color: white; cursor: pointer; font: inherit; min-height: 44px; padding: 0 16px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>The sales portal needs an internet connection to load CRM data. Reconnect and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
